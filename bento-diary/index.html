<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8590c">
<title>お弁当日記</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="お弁当日記">
<style>
  :root {
    --accent: #e8590c;
    --accent-soft: #fff0e6;
    --bg: #faf6f1;
    --card: #ffffff;
    --text: #3d3630;
    --muted: #94897d;
    --line: #ece4da;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 1.15rem; letter-spacing: .04em; }
  header h1 span { margin-right: 6px; }
  #streak { font-size: .8rem; color: var(--muted); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 1rem; margin-bottom: 12px; color: var(--accent); }

  /* ---- 記録フォーム ---- */
  #photoPick {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    width: 100%; aspect-ratio: 4 / 3;
    border: 2px dashed #dcc9b8; border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: .95rem;
    cursor: pointer;
    overflow: hidden;
    position: relative;
  }
  #photoPick .big { font-size: 2.2rem; }
  #photoPick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #photoPick.hasPhoto { border-style: solid; }
  #photoInput { display: none; }

  label.fieldLabel { display: block; font-size: .8rem; color: var(--muted); margin: 14px 0 4px; }
  input[type="date"], textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 1rem; font-family: inherit;
    background: #fffdfb; color: var(--text);
  }
  textarea { min-height: 76px; resize: vertical; }
  button {
    font-family: inherit; font-size: 1rem; border: none; border-radius: 12px;
    padding: 13px 18px; cursor: pointer;
  }
  .btnPrimary {
    width: 100%; margin-top: 16px;
    background: var(--accent); color: #fff; font-weight: 600; letter-spacing: .05em;
  }
  .btnPrimary:disabled { background: #dcc9b8; }
  .btnGhost {
    background: var(--accent-soft); color: var(--accent); font-size: .9rem; padding: 10px 14px;
  }
  .btnDanger { background: #fdeaea; color: #c0392b; font-size: .9rem; padding: 10px 14px; }

  /* ---- タイムライン ---- */
  #timeline .entry {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 16px;
  }
  .entry img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #eee; }
  .entry .body { padding: 12px 16px 14px; }
  .entry .date { font-size: .8rem; color: var(--muted); }
  .entry .comment { margin-top: 4px; white-space: pre-wrap; }
  .entry .actions { display: flex; gap: 8px; margin-top: 10px; }
  .entry .actions button { flex: none; }
  #emptyMsg { text-align: center; color: var(--muted); padding: 30px 10px; font-size: .9rem; }

  /* ---- 出力 ---- */
  .exportRow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .exportRow button { flex: 1 1 45%; }
  input[type="text"], input[type="month"] {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 1rem; font-family: inherit; background: #fffdfb; color: var(--text);
  }
  .segmented { display: flex; gap: 4px; background: var(--accent-soft); border-radius: 12px; padding: 4px; }
  .segmented button { flex: 1; padding: 9px 0; font-size: .88rem; border-radius: 9px; background: none; color: var(--accent); }
  .segmented button.active { background: var(--accent); color: #fff; font-weight: 600; }
  .note { font-size: .78rem; color: var(--muted); margin-top: 8px; }
  #importInput { display: none; }

  /* ---- タブバー ---- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    background: var(--card); border-top: 1px solid var(--line);
    display: flex;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; background: none; border-radius: 0; padding: 10px 0 8px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: .7rem; color: var(--muted);
  }
  nav button .ico { font-size: 1.4rem; }
  nav button.active { color: var(--accent); font-weight: 600; }
  .view { display: none; }
  .view.active { display: block; }

  dialog {
    border: none; border-radius: var(--radius); padding: 20px; max-width: 420px; width: calc(100vw - 40px);
    margin: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h3 { font-size: 1rem; margin-bottom: 12px; }
  dialog .dlgActions { display: flex; gap: 8px; margin-top: 16px; }
  dialog .dlgActions button { flex: 1; }
</style>
</head>
<body>

<header>
  <h1><span>🍱</span>お弁当日記</h1>
  <div id="streak"></div>
</header>

<main>
  <!-- 記録ビュー -->
  <section id="view-record" class="view active">
    <div class="card">
      <h2>今日のお弁当を記録</h2>
      <div id="photoPick" role="button" tabindex="0">
        <span class="big">📷</span>
        <span>タップして写真を撮る・選ぶ</span>
      </div>
      <input type="file" id="photoInput" accept="image/*">
      <label class="fieldLabel" for="dateInput">日付</label>
      <input type="date" id="dateInput">
      <label class="fieldLabel" for="commentInput">ひとことコメント</label>
      <textarea id="commentInput" placeholder="例:唐揚げが最高だった。いつもありがとう!"></textarea>
      <button class="btnPrimary" id="saveBtn" disabled>この日の記録を保存</button>
    </div>
  </section>

  <!-- 一覧ビュー -->
  <section id="view-timeline" class="view">
    <div id="timeline"></div>
    <p id="emptyMsg">まだ記録がありません。<br>「記録」タブから最初のお弁当を残しましょう。</p>
  </section>

  <!-- 出力ビュー -->
  <section id="view-export" class="view">
    <div class="card">
      <h2>🎁 アルバムを作る(プレゼント用)</h2>
      <label class="fieldLabel">出力する範囲</label>
      <div class="segmented" id="modeSeg">
        <button data-mode="month" class="active">1ヶ月分</button>
        <button data-mode="range">期間指定</button>
        <button data-mode="all">全期間</button>
      </div>
      <div id="modeMonth">
        <label class="fieldLabel" for="monthInput">月を選ぶ</label>
        <input type="month" id="monthInput">
      </div>
      <div id="modeRange" hidden>
        <label class="fieldLabel">期間</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="date" id="rangeFrom"> 〜 <input type="date" id="rangeTo">
        </div>
      </div>
      <label class="fieldLabel" for="albumTitle">タイトル(空欄なら「2026年7月のお弁当」のように自動)</label>
      <input type="text" id="albumTitle" placeholder="例:今月のお弁当、ありがとう">
      <label class="fieldLabel" for="albumMessage">とびらページのメッセージ</label>
      <textarea id="albumMessage" placeholder="例:今月もおいしいお弁当をありがとう。唐揚げの日が最高でした!"></textarea>
      <button class="btnPrimary" id="albumBtn">アルバムを書き出す</button>
      <p class="note">「表紙 → 写真入りカレンダー → 1日ごとの記録ページ」の冊子風アルバムが1つのファイルとして保存されます。ブラウザで開いてそのまま見せられるほか、開いた画面から「印刷 → PDFとして保存」すれば印刷してプレゼントにもできます。</p>
    </div>

    <div class="card">
      <h2>💾 バックアップ</h2>
      <div class="exportRow">
        <button class="btnGhost" id="backupBtn">バックアップを書き出す</button>
        <button class="btnGhost" id="importBtn">バックアップから復元</button>
      </div>
      <input type="file" id="importInput" accept=".json,application/json">
      <p class="note">データはこの端末の中だけに保存されます。機種変更の前や、月に1回程度のバックアップ書き出しをおすすめします。</p>
    </div>
  </section>
</main>

<nav>
  <button data-view="record" class="active"><span class="ico">📷</span>記録</button>
  <button data-view="timeline"><span class="ico">📖</span>一覧</button>
  <button data-view="export"><span class="ico">🎁</span>出力</button>
</nav>

<!-- 編集ダイアログ -->
<dialog id="editDlg">
  <h3>記録を編集</h3>
  <label class="fieldLabel" for="editDate">日付</label>
  <input type="date" id="editDate">
  <label class="fieldLabel" for="editComment">コメント</label>
  <textarea id="editComment"></textarea>
  <div class="dlgActions">
    <button class="btnGhost" id="editCancel">キャンセル</button>
    <button class="btnPrimary" style="margin-top:0" id="editSave">保存</button>
  </div>
</dialog>

<script>
"use strict";

/* ---------- IndexedDB ---------- */
const DB_NAME = "bento-diary";
const STORE = "entries";
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      const store = db.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
      store.createIndex("date", "date");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function tx(mode, fn) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const t = db.transaction(STORE, mode);
    const store = t.objectStore(STORE);
    const result = fn(store);
    t.oncomplete = () => resolve(result && result.result !== undefined ? result.result : undefined);
    t.onerror = () => reject(t.error);
  }));
}

const addEntry = (entry) => tx("readwrite", s => s.add(entry));
const putEntry = (entry) => tx("readwrite", s => s.put(entry));
const deleteEntry = (id) => tx("readwrite", s => s.delete(id));
function getAllEntries() {
  return openDB().then(db => new Promise((resolve, reject) => {
    const req = db.transaction(STORE, "readonly").objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

/* ---------- ユーティリティ ---------- */
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];
function formatDateJa(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const wd = WEEKDAYS[new Date(y, m - 1, d).getDay()];
  return `${y}年${m}月${d}日(${wd})`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* 写真を縮小して JPEG Blob にする(保存容量の節約) */
function processPhoto(file, maxDim = 1600, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("画像の変換に失敗しました")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("画像を読み込めませんでした")); };
    img.src = url;
  });
}

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

/* ---------- タブ切り替え ---------- */
const navButtons = document.querySelectorAll("nav button");
navButtons.forEach(btn => btn.addEventListener("click", () => {
  navButtons.forEach(b => b.classList.toggle("active", b === btn));
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-" + btn.dataset.view).classList.add("active");
  if (btn.dataset.view === "timeline") renderTimeline();
  window.scrollTo(0, 0);
}));

/* ---------- 記録フォーム ---------- */
const photoPick = document.getElementById("photoPick");
const photoInput = document.getElementById("photoInput");
const dateInput = document.getElementById("dateInput");
const commentInput = document.getElementById("commentInput");
const saveBtn = document.getElementById("saveBtn");
let pendingPhoto = null;

dateInput.value = todayStr();

photoPick.addEventListener("click", () => photoInput.click());
photoInput.addEventListener("change", async () => {
  const file = photoInput.files[0];
  if (!file) return;
  try {
    pendingPhoto = await processPhoto(file);
    photoPick.innerHTML = "";
    const img = document.createElement("img");
    img.src = URL.createObjectURL(pendingPhoto);
    photoPick.appendChild(img);
    photoPick.classList.add("hasPhoto");
    saveBtn.disabled = false;
  } catch (e) {
    alert(e.message);
  }
});

saveBtn.addEventListener("click", async () => {
  if (!pendingPhoto) return;
  saveBtn.disabled = true;
  await addEntry({
    date: dateInput.value || todayStr(),
    comment: commentInput.value.trim(),
    photo: pendingPhoto,
    createdAt: Date.now(),
  });
  /* フォームをリセット */
  pendingPhoto = null;
  photoInput.value = "";
  commentInput.value = "";
  dateInput.value = todayStr();
  photoPick.classList.remove("hasPhoto");
  photoPick.innerHTML = '<span class="big">📷</span><span>タップして写真を撮る・選ぶ</span>';
  await updateStreak();
  alert("保存しました 🍱");
});

/* ---------- 一覧 ---------- */
const timeline = document.getElementById("timeline");
const emptyMsg = document.getElementById("emptyMsg");
const editDlg = document.getElementById("editDlg");
let editingId = null;

async function renderTimeline() {
  const entries = await getAllEntries();
  entries.sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  timeline.innerHTML = "";
  emptyMsg.style.display = entries.length ? "none" : "block";
  for (const e of entries) {
    const div = document.createElement("div");
    div.className = "entry";
    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = URL.createObjectURL(e.photo);
    div.appendChild(img);
    const body = document.createElement("div");
    body.className = "body";
    body.innerHTML =
      `<div class="date">${formatDateJa(e.date)}</div>` +
      `<div class="comment">${escapeHtml(e.comment) || '<span style="color:var(--muted)">(コメントなし)</span>'}</div>`;
    const actions = document.createElement("div");
    actions.className = "actions";
    const editBtn = document.createElement("button");
    editBtn.className = "btnGhost";
    editBtn.textContent = "編集";
    editBtn.onclick = () => {
      editingId = e.id;
      document.getElementById("editDate").value = e.date;
      document.getElementById("editComment").value = e.comment;
      editDlg.showModal();
    };
    const delBtn = document.createElement("button");
    delBtn.className = "btnDanger";
    delBtn.textContent = "削除";
    delBtn.onclick = async () => {
      if (confirm(`${formatDateJa(e.date)} の記録を削除しますか?`)) {
        await deleteEntry(e.id);
        renderTimeline();
        updateStreak();
      }
    };
    actions.append(editBtn, delBtn);
    body.appendChild(actions);
    div.appendChild(body);
    timeline.appendChild(div);
  }
}

document.getElementById("editCancel").onclick = () => editDlg.close();
document.getElementById("editSave").onclick = async () => {
  const entries = await getAllEntries();
  const entry = entries.find(x => x.id === editingId);
  if (entry) {
    entry.date = document.getElementById("editDate").value || entry.date;
    entry.comment = document.getElementById("editComment").value.trim();
    await putEntry(entry);
  }
  editDlg.close();
  renderTimeline();
};

/* ---------- 記録日数の表示 ---------- */
async function updateStreak() {
  const entries = await getAllEntries();
  const days = new Set(entries.map(e => e.date));
  document.getElementById("streak").textContent = days.size ? `記録 ${days.size} 日分` : "";
}

/* ---------- アルバム出力 ---------- */
let exportMode = "month";
const modeSeg = document.getElementById("modeSeg");
modeSeg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
  exportMode = b.dataset.mode;
  modeSeg.querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
  document.getElementById("modeMonth").hidden = exportMode !== "month";
  document.getElementById("modeRange").hidden = exportMode !== "range";
}));
document.getElementById("monthInput").value = todayStr().slice(0, 7);

/* カレンダー用の正方形サムネイルを作る */
function makeThumb(blob, size = 240, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      canvas.getContext("2d").drawImage(img, sx, sy, side, side, 0, 0, size, size);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("サムネイル作成に失敗しました")); };
    img.src = url;
  });
}

/* 写真入りの月間カレンダーHTMLを組み立てる */
function buildCalendar(year, month, thumbsByDate) {
  const firstDow = new Date(year, month - 1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  let cells = "";
  for (let i = 0; i < firstDow; i++) cells += '<div class="cell empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${year}-${String(month).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const t = thumbsByDate.get(key);
    cells += `<div class="cell${t ? " has" : ""}">${t ? `<img src="${t}" alt="">` : ""}<span class="num">${d}</span></div>`;
  }
  const dow = ["日", "月", "火", "水", "木", "金", "土"]
    .map((w, i) => `<span class="${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${w}</span>`).join("");
  return `<section class="calpage">
<h2 class="calhead"><span class="m">${month}</span><span class="unit">月</span><span class="y">${year}</span></h2>
<div class="dow">${dow}</div>
<div class="calgrid">${cells}</div>
</section>`;
}

document.getElementById("albumBtn").addEventListener("click", async () => {
  const btn = document.getElementById("albumBtn");
  btn.disabled = true;
  btn.textContent = "作成中…";
  try {
    let entries = await getAllEntries();
    let from = "", to = "", autoTitle = "お弁当のきろく", periodLabel = "";
    if (exportMode === "month") {
      const m = document.getElementById("monthInput").value;
      if (!m) { alert("月を選んでください。"); return; }
      from = m + "-01"; to = m + "-31";
      const [y, mo] = m.split("-").map(Number);
      autoTitle = `${y}年${mo}月のお弁当`;
      periodLabel = `${y}年${mo}月`;
    } else if (exportMode === "range") {
      from = document.getElementById("rangeFrom").value;
      to = document.getElementById("rangeTo").value;
    }
    if (from) entries = entries.filter(e => e.date >= from);
    if (to) entries = entries.filter(e => e.date <= to);
    if (!entries.length) { alert("この期間に記録がありません。"); return; }
    entries.sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt);

    const title = document.getElementById("albumTitle").value.trim() || autoTitle;
    const message = document.getElementById("albumMessage").value.trim();
    if (!periodLabel) {
      periodLabel = `${formatDateJa(entries[0].date)} 〜 ${formatDateJa(entries[entries.length - 1].date)}`;
    }
    const dayCount = new Set(entries.map(e => e.date)).size;

    /* 月ごとに「カレンダー+記録ページ」を作る */
    const byMonth = new Map();
    for (const e of entries) {
      const k = e.date.slice(0, 7);
      if (!byMonth.has(k)) byMonth.set(k, []);
      byMonth.get(k).push(e);
    }
    const sections = [];
    for (const [ym, list] of byMonth) {
      const [yy, mm] = ym.split("-").map(Number);
      const thumbs = new Map();
      for (const e of list) {
        if (!thumbs.has(e.date)) thumbs.set(e.date, await makeThumb(e.photo));
      }
      const shots = [];
      for (const e of list) {
        const [, m2, d2] = e.date.split("-").map(Number);
        const wd = WEEKDAYS[new Date(yy, m2 - 1, d2).getDay()];
        const dataUrl = await blobToDataURL(e.photo);
        shots.push(`<figure class="shot">
<div class="photo"><img src="${dataUrl}" alt=""></div>
<figcaption><div class="d">${m2}月${d2}日(${wd})</div>${e.comment ? `<div class="c">${escapeHtml(e.comment)}</div>` : ""}</figcaption>
</figure>`);
      }
      sections.push(buildCalendar(yy, mm, thumbs) + `\n<div class="shots">${shots.join("\n")}</div>`);
    }

    const html = `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escapeHtml(title)}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; background: #f6efe6; color: #41382e; }
  /* --- 表紙 --- */
  .cover { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
  .cover .frame { width: 100%; max-width: 560px; background: #fffdf8; border: 1px solid #cfae7f; padding: 60px 30px; text-align: center; position: relative; box-shadow: 0 10px 40px rgba(90,60,20,.12); }
  .cover .frame::before { content: ""; position: absolute; inset: 8px; border: 1px solid #e6d4b6; pointer-events: none; }
  .cover .mark { font-size: 2.6rem; }
  .cover h1 { font-size: 1.65rem; letter-spacing: .14em; margin: 20px 0 10px; font-weight: 600; }
  .cover .period { color: #a08c6d; letter-spacing: .22em; font-size: .82rem; }
  .cover .msg { margin: 32px auto 0; max-width: 26em; white-space: pre-wrap; line-height: 2.2; font-size: .95rem; }
  .cover .stats { margin-top: 36px; color: #b0500e; font-size: .82rem; letter-spacing: .12em; }
  /* --- カレンダー --- */
  .calpage { max-width: 640px; margin: 64px auto 44px; padding: 0 16px; }
  .calhead { text-align: center; margin-bottom: 18px; font-weight: 600; }
  .calhead .m { font-size: 2.5rem; color: #b0500e; }
  .calhead .unit { font-size: 1rem; margin: 0 8px 0 2px; }
  .calhead .y { font-size: .85rem; color: #a08c6d; letter-spacing: .18em; }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: .7rem; color: #a08c6d; margin-bottom: 6px; }
  .dow .sun { color: #c0605a; } .dow .sat { color: #6a89a8; }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cell { aspect-ratio: 1; border-radius: 8px; background: #fdf8f0; border: 1px solid #eee3d2; position: relative; overflow: hidden; }
  .cell.empty { background: none; border: none; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell .num { position: absolute; top: 2px; left: 5px; font-size: .62rem; color: #a08c6d; }
  .cell.has .num { color: #fff; text-shadow: 0 0 4px rgba(0,0,0,.75); }
  /* --- 記録ページ(ポラロイド風) --- */
  .shots { padding: 0 16px; }
  .shot { background: #fffdf8; border: 1px solid #eadfcc; box-shadow: 0 6px 24px rgba(90,60,20,.10); padding: 14px 14px 18px; margin: 0 auto 40px; max-width: 440px; }
  .shot .photo img { width: 100%; display: block; }
  .shot figcaption { padding: 12px 4px 0; }
  .shot .d { font-size: .78rem; color: #a08c6d; letter-spacing: .12em; }
  .shot .c { margin-top: 4px; line-height: 2; white-space: pre-wrap; font-size: .95rem; }
  .fin { text-align: center; padding: 70px 20px 90px; color: #a08c6d; letter-spacing: .3em; line-height: 2.4; }
  .fin .small { font-size: .78rem; }
  /* --- 印刷(PDF化)用 --- */
  @page { size: A4; margin: 12mm; }
  @media print {
    body { background: #fff; }
    .cover { min-height: auto; page-break-after: always; }
    .cover .frame { box-shadow: none; }
    .calpage { page-break-after: always; margin-top: 10mm; }
    .shot { break-inside: avoid; box-shadow: none; max-width: 126mm; }
    .shot .photo img { max-height: 92mm; object-fit: cover; }
    .fin { page-break-before: always; }
  }
</style>
</head>
<body>
<div class="cover">
  <div class="frame">
    <div class="mark">🍱</div>
    <h1>${escapeHtml(title)}</h1>
    ${title === autoTitle && exportMode === "month" ? "" : `<div class="period">${periodLabel}</div>`}
    ${message ? `<p class="msg">${escapeHtml(message)}</p>` : ""}
    <div class="stats">お弁当の記録 ${dayCount}日分・${entries.length}枚</div>
  </div>
</div>
${sections.join("\n")}
<div class="fin">🍱<br>ごちそうさまでした<br><span class="small">${dayCount}日分の、ありがとう。</span></div>
</body>
</html>`;

    const blob = new Blob([html], { type: "text/html" });
    const filename = exportMode === "month"
      ? `obento-album-${document.getElementById("monthInput").value}.html`
      : `obento-album-${entries[0].date}_${entries[entries.length - 1].date}.html`;
    if (navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: "text/html" })] })) {
      try {
        await navigator.share({ files: [new File([blob], filename, { type: "text/html" })], title });
        return;
      } catch (e) {
        if (e.name === "AbortError") return; /* ユーザーがキャンセル */
        /* 共有に失敗したらダウンロードにフォールバック */
      }
    }
    downloadBlob(blob, filename);
  } finally {
    btn.disabled = false;
    btn.textContent = "アルバムを書き出す";
  }
});

/* ---------- バックアップ ---------- */
document.getElementById("backupBtn").addEventListener("click", async () => {
  const entries = await getAllEntries();
  if (!entries.length) { alert("まだ記録がありません。"); return; }
  const out = [];
  for (const e of entries) {
    out.push({ date: e.date, comment: e.comment, createdAt: e.createdAt, photo: await blobToDataURL(e.photo) });
  }
  const blob = new Blob([JSON.stringify({ app: "bento-diary", version: 1, entries: out })], { type: "application/json" });
  downloadBlob(blob, `obento-backup-${todayStr()}.json`);
});

document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importInput").click());
document.getElementById("importInput").addEventListener("change", async (ev) => {
  const file = ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "bento-diary" || !Array.isArray(data.entries)) throw new Error("形式が違います");
    if (!confirm(`${data.entries.length}件の記録を取り込みます。よろしいですか?(既存の記録はそのまま残ります)`)) return;
    for (const e of data.entries) {
      const res = await fetch(e.photo);
      const blob = await res.blob();
      await addEntry({ date: e.date, comment: e.comment || "", photo: blob, createdAt: e.createdAt || Date.now() });
    }
    alert("復元しました。");
    updateStreak();
  } catch (err) {
    alert("読み込めませんでした: " + err.message);
  }
});

/* ---------- 初期化 ---------- */
updateStreak();
/* 端末容量が逼迫してもブラウザにデータを消されにくくする */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
