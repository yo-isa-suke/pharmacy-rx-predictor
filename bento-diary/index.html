<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8590c">
<title>お弁当日記</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="お弁当日記">
<style>
  :root {
    --accent: #e8590c;
    --accent-soft: #fff0e6;
    --bg: #faf6f1;
    --card: #ffffff;
    --text: #3d3630;
    --muted: #94897d;
    --line: #ece4da;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 1.15rem; letter-spacing: .04em; }
  header h1 span { margin-right: 6px; }
  #streak { font-size: .8rem; color: var(--muted); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 1rem; margin-bottom: 12px; color: var(--accent); }

  /* ---- 記録フォーム ---- */
  #photoPick {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    width: 100%; aspect-ratio: 4 / 3;
    border: 2px dashed #dcc9b8; border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: .95rem;
    cursor: pointer;
    overflow: hidden;
    position: relative;
  }
  #photoPick .big { font-size: 2.2rem; }
  #photoPick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #photoPick.hasPhoto { border-style: solid; }
  #photoInput { display: none; }

  label.fieldLabel { display: block; font-size: .8rem; color: var(--muted); margin: 14px 0 4px; }
  input[type="date"], textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 1rem; font-family: inherit;
    background: #fffdfb; color: var(--text);
  }
  textarea { min-height: 76px; resize: vertical; }
  button {
    font-family: inherit; font-size: 1rem; border: none; border-radius: 12px;
    padding: 13px 18px; cursor: pointer;
  }
  .btnPrimary {
    width: 100%; margin-top: 16px;
    background: var(--accent); color: #fff; font-weight: 600; letter-spacing: .05em;
  }
  .btnPrimary:disabled { background: #dcc9b8; }
  .btnGhost {
    background: var(--accent-soft); color: var(--accent); font-size: .9rem; padding: 10px 14px;
  }
  .btnDanger { background: #fdeaea; color: #c0392b; font-size: .9rem; padding: 10px 14px; }

  /* ---- タイムライン ---- */
  #timeline .entry {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 16px;
  }
  .entry img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #eee; }
  .entry .body { padding: 12px 16px 14px; }
  .entry .date { font-size: .8rem; color: var(--muted); }
  .entry .comment { margin-top: 4px; white-space: pre-wrap; }
  .entry .actions { display: flex; gap: 8px; margin-top: 10px; }
  .entry .actions button { flex: none; }
  #emptyMsg { text-align: center; color: var(--muted); padding: 30px 10px; font-size: .9rem; }

  /* ---- 出力 ---- */
  .exportRow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .exportRow button { flex: 1 1 45%; }
  input[type="text"] {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 1rem; font-family: inherit; background: #fffdfb; color: var(--text);
  }
  .note { font-size: .78rem; color: var(--muted); margin-top: 8px; }
  #importInput { display: none; }

  /* ---- タブバー ---- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    background: var(--card); border-top: 1px solid var(--line);
    display: flex;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; background: none; border-radius: 0; padding: 10px 0 8px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: .7rem; color: var(--muted);
  }
  nav button .ico { font-size: 1.4rem; }
  nav button.active { color: var(--accent); font-weight: 600; }
  .view { display: none; }
  .view.active { display: block; }

  dialog {
    border: none; border-radius: var(--radius); padding: 20px; max-width: 420px; width: calc(100vw - 40px);
    margin: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h3 { font-size: 1rem; margin-bottom: 12px; }
  dialog .dlgActions { display: flex; gap: 8px; margin-top: 16px; }
  dialog .dlgActions button { flex: 1; }
</style>
</head>
<body>

<header>
  <h1><span>🍱</span>お弁当日記</h1>
  <div id="streak"></div>
</header>

<main>
  <!-- 記録ビュー -->
  <section id="view-record" class="view active">
    <div class="card">
      <h2>今日のお弁当を記録</h2>
      <div id="photoPick" role="button" tabindex="0">
        <span class="big">📷</span>
        <span>タップして写真を撮る・選ぶ</span>
      </div>
      <input type="file" id="photoInput" accept="image/*">
      <label class="fieldLabel" for="dateInput">日付</label>
      <input type="date" id="dateInput">
      <label class="fieldLabel" for="commentInput">ひとことコメント</label>
      <textarea id="commentInput" placeholder="例:唐揚げが最高だった。いつもありがとう!"></textarea>
      <button class="btnPrimary" id="saveBtn" disabled>この日の記録を保存</button>
    </div>
  </section>

  <!-- 一覧ビュー -->
  <section id="view-timeline" class="view">
    <div id="timeline"></div>
    <p id="emptyMsg">まだ記録がありません。<br>「記録」タブから最初のお弁当を残しましょう。</p>
  </section>

  <!-- 出力ビュー -->
  <section id="view-export" class="view">
    <div class="card">
      <h2>🎁 アルバムを作る(プレゼント用)</h2>
      <label class="fieldLabel" for="albumTitle">アルバムのタイトル</label>
      <input type="text" id="albumTitle" value="毎日のお弁当、ありがとう">
      <label class="fieldLabel" for="albumMessage">表紙に入れるメッセージ</label>
      <textarea id="albumMessage" placeholder="例:1年間、毎朝お弁当を作ってくれてありがとう。全部おいしかった!"></textarea>
      <label class="fieldLabel">対象期間(空欄なら全期間)</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="date" id="rangeFrom"> 〜 <input type="date" id="rangeTo">
      </div>
      <button class="btnPrimary" id="albumBtn">アルバム(HTML)を書き出す</button>
      <p class="note">写真入りの1つのファイルとして保存されます。スマホやPCのブラウザで開いてそのまま見せられます。開いた画面から「印刷 → PDFとして保存」で冊子印刷用のPDFにもできます。</p>
    </div>

    <div class="card">
      <h2>💾 バックアップ</h2>
      <div class="exportRow">
        <button class="btnGhost" id="backupBtn">バックアップを書き出す</button>
        <button class="btnGhost" id="importBtn">バックアップから復元</button>
      </div>
      <input type="file" id="importInput" accept=".json,application/json">
      <p class="note">データはこの端末の中だけに保存されます。機種変更の前や、月に1回程度のバックアップ書き出しをおすすめします。</p>
    </div>
  </section>
</main>

<nav>
  <button data-view="record" class="active"><span class="ico">📷</span>記録</button>
  <button data-view="timeline"><span class="ico">📖</span>一覧</button>
  <button data-view="export"><span class="ico">🎁</span>出力</button>
</nav>

<!-- 編集ダイアログ -->
<dialog id="editDlg">
  <h3>記録を編集</h3>
  <label class="fieldLabel" for="editDate">日付</label>
  <input type="date" id="editDate">
  <label class="fieldLabel" for="editComment">コメント</label>
  <textarea id="editComment"></textarea>
  <div class="dlgActions">
    <button class="btnGhost" id="editCancel">キャンセル</button>
    <button class="btnPrimary" style="margin-top:0" id="editSave">保存</button>
  </div>
</dialog>

<script>
"use strict";

/* ---------- IndexedDB ---------- */
const DB_NAME = "bento-diary";
const STORE = "entries";
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      const store = db.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
      store.createIndex("date", "date");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function tx(mode, fn) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const t = db.transaction(STORE, mode);
    const store = t.objectStore(STORE);
    const result = fn(store);
    t.oncomplete = () => resolve(result && result.result !== undefined ? result.result : undefined);
    t.onerror = () => reject(t.error);
  }));
}

const addEntry = (entry) => tx("readwrite", s => s.add(entry));
const putEntry = (entry) => tx("readwrite", s => s.put(entry));
const deleteEntry = (id) => tx("readwrite", s => s.delete(id));
function getAllEntries() {
  return openDB().then(db => new Promise((resolve, reject) => {
    const req = db.transaction(STORE, "readonly").objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

/* ---------- ユーティリティ ---------- */
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];
function formatDateJa(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const wd = WEEKDAYS[new Date(y, m - 1, d).getDay()];
  return `${y}年${m}月${d}日(${wd})`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* 写真を縮小して JPEG Blob にする(保存容量の節約) */
function processPhoto(file, maxDim = 1600, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("画像の変換に失敗しました")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("画像を読み込めませんでした")); };
    img.src = url;
  });
}

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

/* ---------- タブ切り替え ---------- */
const navButtons = document.querySelectorAll("nav button");
navButtons.forEach(btn => btn.addEventListener("click", () => {
  navButtons.forEach(b => b.classList.toggle("active", b === btn));
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-" + btn.dataset.view).classList.add("active");
  if (btn.dataset.view === "timeline") renderTimeline();
  window.scrollTo(0, 0);
}));

/* ---------- 記録フォーム ---------- */
const photoPick = document.getElementById("photoPick");
const photoInput = document.getElementById("photoInput");
const dateInput = document.getElementById("dateInput");
const commentInput = document.getElementById("commentInput");
const saveBtn = document.getElementById("saveBtn");
let pendingPhoto = null;

dateInput.value = todayStr();

photoPick.addEventListener("click", () => photoInput.click());
photoInput.addEventListener("change", async () => {
  const file = photoInput.files[0];
  if (!file) return;
  try {
    pendingPhoto = await processPhoto(file);
    photoPick.innerHTML = "";
    const img = document.createElement("img");
    img.src = URL.createObjectURL(pendingPhoto);
    photoPick.appendChild(img);
    photoPick.classList.add("hasPhoto");
    saveBtn.disabled = false;
  } catch (e) {
    alert(e.message);
  }
});

saveBtn.addEventListener("click", async () => {
  if (!pendingPhoto) return;
  saveBtn.disabled = true;
  await addEntry({
    date: dateInput.value || todayStr(),
    comment: commentInput.value.trim(),
    photo: pendingPhoto,
    createdAt: Date.now(),
  });
  /* フォームをリセット */
  pendingPhoto = null;
  photoInput.value = "";
  commentInput.value = "";
  dateInput.value = todayStr();
  photoPick.classList.remove("hasPhoto");
  photoPick.innerHTML = '<span class="big">📷</span><span>タップして写真を撮る・選ぶ</span>';
  await updateStreak();
  alert("保存しました 🍱");
});

/* ---------- 一覧 ---------- */
const timeline = document.getElementById("timeline");
const emptyMsg = document.getElementById("emptyMsg");
const editDlg = document.getElementById("editDlg");
let editingId = null;

async function renderTimeline() {
  const entries = await getAllEntries();
  entries.sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  timeline.innerHTML = "";
  emptyMsg.style.display = entries.length ? "none" : "block";
  for (const e of entries) {
    const div = document.createElement("div");
    div.className = "entry";
    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = URL.createObjectURL(e.photo);
    div.appendChild(img);
    const body = document.createElement("div");
    body.className = "body";
    body.innerHTML =
      `<div class="date">${formatDateJa(e.date)}</div>` +
      `<div class="comment">${escapeHtml(e.comment) || '<span style="color:var(--muted)">(コメントなし)</span>'}</div>`;
    const actions = document.createElement("div");
    actions.className = "actions";
    const editBtn = document.createElement("button");
    editBtn.className = "btnGhost";
    editBtn.textContent = "編集";
    editBtn.onclick = () => {
      editingId = e.id;
      document.getElementById("editDate").value = e.date;
      document.getElementById("editComment").value = e.comment;
      editDlg.showModal();
    };
    const delBtn = document.createElement("button");
    delBtn.className = "btnDanger";
    delBtn.textContent = "削除";
    delBtn.onclick = async () => {
      if (confirm(`${formatDateJa(e.date)} の記録を削除しますか?`)) {
        await deleteEntry(e.id);
        renderTimeline();
        updateStreak();
      }
    };
    actions.append(editBtn, delBtn);
    body.appendChild(actions);
    div.appendChild(body);
    timeline.appendChild(div);
  }
}

document.getElementById("editCancel").onclick = () => editDlg.close();
document.getElementById("editSave").onclick = async () => {
  const entries = await getAllEntries();
  const entry = entries.find(x => x.id === editingId);
  if (entry) {
    entry.date = document.getElementById("editDate").value || entry.date;
    entry.comment = document.getElementById("editComment").value.trim();
    await putEntry(entry);
  }
  editDlg.close();
  renderTimeline();
};

/* ---------- 記録日数の表示 ---------- */
async function updateStreak() {
  const entries = await getAllEntries();
  const days = new Set(entries.map(e => e.date));
  document.getElementById("streak").textContent = days.size ? `記録 ${days.size} 日分` : "";
}

/* ---------- アルバム出力 ---------- */
document.getElementById("albumBtn").addEventListener("click", async () => {
  const btn = document.getElementById("albumBtn");
  btn.disabled = true;
  btn.textContent = "作成中…";
  try {
    let entries = await getAllEntries();
    const from = document.getElementById("rangeFrom").value;
    const to = document.getElementById("rangeTo").value;
    if (from) entries = entries.filter(e => e.date >= from);
    if (to) entries = entries.filter(e => e.date <= to);
    if (!entries.length) { alert("この期間に記録がありません。"); return; }
    entries.sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt);

    const title = document.getElementById("albumTitle").value.trim() || "お弁当アルバム";
    const message = document.getElementById("albumMessage").value.trim();
    const first = formatDateJa(entries[0].date);
    const last = formatDateJa(entries[entries.length - 1].date);
    const dayCount = new Set(entries.map(e => e.date)).size;

    const pages = [];
    for (const e of entries) {
      const dataUrl = await blobToDataURL(e.photo);
      pages.push(
        `<figure class="page">` +
        `<img src="${dataUrl}" alt="">` +
        `<figcaption><div class="d">${formatDateJa(e.date)}</div>` +
        `<div class="c">${escapeHtml(e.comment)}</div></figcaption>` +
        `</figure>`
      );
    }

    const html = `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escapeHtml(title)}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Hiragino Mincho ProN", "Noto Serif JP", serif; background: #f7f2ec; color: #3d3630; }
  .cover { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; }
  .cover .mark { font-size: 3rem; }
  .cover h1 { font-size: 1.8rem; margin: 18px 0 10px; letter-spacing: .1em; }
  .cover .period { color: #94897d; font-size: .9rem; }
  .cover .msg { margin-top: 28px; max-width: 34em; white-space: pre-wrap; line-height: 2; }
  .cover .stats { margin-top: 34px; font-size: .95rem; color: #b0500e; }
  .page { max-width: 640px; margin: 0 auto 48px; padding: 0 16px; }
  .page img { width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(60,40,20,.12); }
  .page figcaption { padding: 12px 6px 0; }
  .page .d { font-size: .85rem; color: #94897d; }
  .page .c { margin-top: 4px; white-space: pre-wrap; line-height: 1.9; }
  .fin { text-align: center; padding: 60px 20px 80px; color: #94897d; letter-spacing: .2em; }
  @media print {
    body { background: #fff; }
    .cover { page-break-after: always; min-height: 90vh; }
    .page { page-break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="cover">
  <div class="mark">🍱</div>
  <h1>${escapeHtml(title)}</h1>
  <div class="period">${first} 〜 ${last}</div>
  ${message ? `<p class="msg">${escapeHtml(message)}</p>` : ""}
  <div class="stats">お弁当の記録:${dayCount}日分・${entries.length}枚</div>
</div>
${pages.join("\n")}
<div class="fin">ごちそうさまでした。</div>
</body>
</html>`;

    const blob = new Blob([html], { type: "text/html" });
    const filename = `obento-album-${entries[0].date}_${entries[entries.length - 1].date}.html`;
    if (navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: "text/html" })] })) {
      try {
        await navigator.share({ files: [new File([blob], filename, { type: "text/html" })], title });
        return;
      } catch (e) {
        if (e.name === "AbortError") return; /* ユーザーがキャンセル */
        /* 共有に失敗したらダウンロードにフォールバック */
      }
    }
    downloadBlob(blob, filename);
  } finally {
    btn.disabled = false;
    btn.textContent = "アルバム(HTML)を書き出す";
  }
});

/* ---------- バックアップ ---------- */
document.getElementById("backupBtn").addEventListener("click", async () => {
  const entries = await getAllEntries();
  if (!entries.length) { alert("まだ記録がありません。"); return; }
  const out = [];
  for (const e of entries) {
    out.push({ date: e.date, comment: e.comment, createdAt: e.createdAt, photo: await blobToDataURL(e.photo) });
  }
  const blob = new Blob([JSON.stringify({ app: "bento-diary", version: 1, entries: out })], { type: "application/json" });
  downloadBlob(blob, `obento-backup-${todayStr()}.json`);
});

document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importInput").click());
document.getElementById("importInput").addEventListener("change", async (ev) => {
  const file = ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "bento-diary" || !Array.isArray(data.entries)) throw new Error("形式が違います");
    if (!confirm(`${data.entries.length}件の記録を取り込みます。よろしいですか?(既存の記録はそのまま残ります)`)) return;
    for (const e of data.entries) {
      const res = await fetch(e.photo);
      const blob = await res.blob();
      await addEntry({ date: e.date, comment: e.comment || "", photo: blob, createdAt: e.createdAt || Date.now() });
    }
    alert("復元しました。");
    updateStreak();
  } catch (err) {
    alert("読み込めませんでした: " + err.message);
  }
});

/* ---------- 初期化 ---------- */
updateStreak();

if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
